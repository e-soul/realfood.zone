dependencies {
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation "software.amazon.awssdk:dynamodb"
    implementation "software.amazon.awssdk:dynamodb-enhanced"
    implementation "software.amazon.awssdk:regions"

    testImplementation project(":zone.realfood.backend")
    testImplementation project(":zone.realfood.test.tools")

    testImplementation "com.amazonaws:aws-lambda-java-core:${awsLambdaCoreVersion}"
    testImplementation "com.amazonaws:aws-lambda-java-events:${awsLambdaEventsVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
}

test {
    // Show standard output and errors from tests in the Gradle stdout
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showCauses true
        showExceptions true
        showStackTraces true
    }
}
