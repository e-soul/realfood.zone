plugins {
  // Use java-library so that 'api' scoped dependencies are visible to dependent projects (e.g., zone.realfood.server)
  id 'java-library'
  id 'com.gradleup.shadow' version "9.0.2"
  id 'gg.jte.gradle' version '3.2.1'
}

dependencies {
  // Expose libraries needed by downstream server code via 'api'
  api 'com.amazonaws:aws-lambda-java-core:1.3.0'
  api 'com.amazonaws:aws-lambda-java-events:3.16.1'
  api platform('software.amazon.awssdk:bom:2.25.66')
  api 'software.amazon.awssdk:dynamodb'
  api 'software.amazon.awssdk:regions'
  api 'software.amazon.awssdk:dynamodb-enhanced'
  api 'gg.jte:jte:3.2.1'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
}

// Precompile jte templates during build, then bundle them into the fat jar
jte { precompile() }

tasks.shadowJar {
  // Use classifier to distinguish fat jar from thin jar (zone.realfood.backend-all.jar)
  archiveClassifier.set('all')
  mergeServiceFiles()
  dependsOn tasks.precompileJte
  from fileTree("jte-classes") {
    include "**/*.class"
    include "**/*.bin" // present only if binary templates enabled
  }
}

// Also include jte-classes in the regular (thin) jar so tests and dependent modules can resolve templates
tasks.jar {
  // Safely include precompiled templates; rely on precompileJte having run
  dependsOn tasks.precompileJte
  from("$projectDir/jte-classes") { include "**/*.class"; include "**/*.bin" }
}
