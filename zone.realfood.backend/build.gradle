plugins {
  id 'java'
  id 'com.gradleup.shadow' version "9.0.2"
  id 'gg.jte.gradle' version '3.2.1'
}

dependencies {
  implementation 'com.amazonaws:aws-lambda-java-core:1.3.0'
  implementation 'com.amazonaws:aws-lambda-java-events:3.16.1'
  implementation platform('software.amazon.awssdk:bom:2.25.66')
  implementation 'software.amazon.awssdk:dynamodb'
  implementation 'software.amazon.awssdk:regions'
  implementation 'software.amazon.awssdk:dynamodb-enhanced'
  implementation 'gg.jte:jte:3.2.1'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
}

// Precompile jte templates during build, then bundle them into the fat jar
jte { precompile() }

tasks.shadowJar {
  archiveFileName.set('zone.realfood.backend.jar')
  mergeServiceFiles()
  dependsOn tasks.precompileJte
  from fileTree("jte-classes") {
    include "**/*.class"
    include "**/*.bin" // present only if binary templates enabled
  }
}

tasks.build.dependsOn tasks.shadowJar
