plugins {
    id "com.gradleup.shadow" version "9.3.0"
    id "gg.jte.gradle" version "3.2.1"
}

dependencies {
    implementation project(":zone.realfood.api")

    implementation "com.amazonaws:aws-lambda-java-core:${awsLambdaCoreVersion}"
    implementation "com.amazonaws:aws-lambda-java-events:${awsLambdaEventsVersion}"

    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation "software.amazon.awssdk:dynamodb"
    implementation "software.amazon.awssdk:dynamodb-enhanced"
    implementation "software.amazon.awssdk:regions"

    implementation "gg.jte:jte:${jteVersion}"

    implementation "com.google.api-client:google-api-client:${googleApiClientVersion}"
    
    testImplementation "org.junit.jupiter:junit-jupiter:${junitJupiterVersion}"
}

// Precompile jte templates during build, then bundle them into the fat jar
jte {
    precompile()
}

tasks.shadowJar {
    // Use classifier to distinguish fat jar from thin jar (zone.realfood.backend-all.jar)
    archiveClassifier.set("all")
    mergeServiceFiles()
    dependsOn tasks.precompileJte
    from fileTree("jte-classes") {
        include "**/*.class"
        include "**/*.bin" // present only if binary templates enabled
    }
}

// Also include jte-classes in the regular (thin) jar so tests and dependent modules can resolve templates
tasks.jar {
    // Safely include precompiled templates; rely on precompileJte having run
    dependsOn tasks.precompileJte
    from("$projectDir/jte-classes") { include "**/*.class"; include "**/*.bin" }
}
