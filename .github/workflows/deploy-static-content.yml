name: Deploy Static Content

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cdk-deploy-static-content-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Build backend & CDK fat jars
        run: gradle clean :zone.realfood.backend:shadowJar :zone.realfood.cdk:shadowJar

      - name: Set up Node.js for CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Bootstrap (idempotent; safe to run)
        run: npx -y aws-cdk@2 bootstrap --no-telemetry aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: CDK Deploy
        run: npx -y aws-cdk@2 deploy --no-telemetry StaticContent --require-approval never
