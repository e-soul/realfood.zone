name: Destroy CDK Stack

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack name to destroy'
        required: true
        default: 'HelloStack'
        type: string
      confirm:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cdk-destroy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Build Lambda & CDK jars
        run: |
          gradle clean :lambda:shadowJar :cdk:shadowJar

      - name: Set up Node.js for CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Destroy
        run: npx -y aws-cdk@2 destroy --no-telemetry --force ${{ github.event.inputs.stack }}
