name: Build & Deploy CDK

on:
  push:
    branches: [ "serverless" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Build Lambda & CDK jars
        run: |
          gradle clean :lambda:shadowJar :cdk:shadowJar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-jars
          path: |
            lambda/build/libs/hello-lambda.jar
            cdk/build/libs/cdk.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-jars
          path: .

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js for CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Bootstrap (idempotent; safe to run)
        run: npx -y aws-cdk@2 bootstrap --no-telemetry aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: CDK Deploy
        run: npx -y aws-cdk@2 deploy --no-telemetry HelloStack --require-approval never
