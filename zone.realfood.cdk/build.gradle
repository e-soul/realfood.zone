plugins {
  id 'java'
  id 'com.gradleup.shadow' version "9.0.2"
}

dependencies {
  implementation 'software.amazon.awscdk:aws-cdk-lib:2.211.0'
  implementation 'software.constructs:constructs:10.4.2'
}

tasks.shadowJar {
  archiveClassifier.set('all') // produces zone.realfood.cdk-all.jar
  mergeServiceFiles()
  manifest { attributes 'Main-Class': 'zone.realfood.Main' }
}
