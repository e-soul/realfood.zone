plugins {
    id "com.gradleup.shadow" version "9.3.0"
}

dependencies {
    implementation "software.amazon.awscdk:aws-cdk-lib:${awsCdkVersion}"
    implementation "software.constructs:constructs:${constructsVersion}"
}

tasks.shadowJar {
    archiveClassifier.set("all") // produces zone.realfood.cdk-all.jar
    mergeServiceFiles()
    manifest { attributes "Main-Class": "zone.realfood.Main" }
}
